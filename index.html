<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.json"><title>JJ Marques - Gestão</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#eef2f7;color:#1f2937}.hidden{display:none!important}button,input,select{font:inherit;padding:10px;border-radius:7px}button{border:0;cursor:pointer}input,select{width:100%;border:1px solid #cbd5e1}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#2563eb);padding:20px}.card,.panel{background:#fff;border-radius:14px;padding:25px;box-shadow:0 8px 25px #0002}.card{width:min(410px,100%)}h1{text-align:center}.field{margin:15px 0}.field label{display:block;font-weight:bold;margin-bottom:6px}.primary{background:#2563eb;color:#fff;width:100%}.error{color:#dc2626;text-align:center;min-height:20px}header{background:#0f172a;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}header h1{margin:0;text-align:left}header p{margin:5px 0}.actions{display:flex;gap:8px}.blue{background:#2563eb;color:#fff}.red{background:#dc2626;color:#fff}.green{background:#16a34a;color:#fff}.gray{background:#64748b;color:#fff}.orange{background:#f59e0b;color:#fff}main{width:min(1400px,94%);margin:30px auto}.panel{margin-bottom:22px}.folders,.summary,.form-grid{display:grid;gap:16px}.folders{grid-template-columns:repeat(4,1fr)}.folder{background:#f8fafc;border:2px solid transparent;padding:24px}.folder:hover{border-color:#2563eb}.folder span{font-size:44px}.summary{grid-template-columns:repeat(3,1fr)}.stat{text-align:center;padding:17px;border-radius:10px}.expired{background:#fee2e2;color:#991b1b}.soon{background:#fef3c7;color:#92400e}.total{background:#dbeafe;color:#1e40af}.alerts{display:grid;gap:10px;margin-top:16px}.alert{padding:14px;border-radius:9px;display:flex;justify-content:space-between}.form-grid{grid-template-columns:repeat(3,1fr)}.form-actions{display:flex;gap:8px;margin-top:15px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center}.toolbar input{max-width:370px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e2e8f0;white-space:nowrap;text-align:left}th{background:#f8fafc}.date-expired{background:#fee2e2;color:#b91c1c;font-weight:bold}.date-soon{background:#fef3c7;color:#b45309;font-weight:bold}@media(max-width:900px){.folders,.summary,.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header,.toolbar{align-items:stretch;flex-direction:column}.actions,.form-actions{flex-direction:column}.folders,.summary,.form-grid{grid-template-columns:1fr}}</style></head><body><section id="login" class="login"><form id="loginForm" class="card"><h1>JJ Marques</h1><p style="text-align:center">Sistema de gestão</p><div class="field"><label>Utilizador</label><input id="username" required></div><div class="field"><label>Palavra-passe</label><input id="password" type="password" required></div><button class="primary">Entrar</button><p id="loginError" class="error"></p></form></section><section id="app" class="hidden"><header><div><h1>JJ Marques</h1><p id="pageName">Menu principal</p><small>Sessão: <strong id="loggedUser"></strong></small></div><div class="actions"><button id="backBtn" class="blue hidden">Voltar ao menu</button><button id="installBtn" class="blue hidden">Instalar</button><button id="logoutBtn" class="red">Sair</button></div></header><main><section id="menu" class="panel"><h2>Pastas de registo</h2><div class="folders"><button class="folder" data-category="tratores"><span>🚛</span><h3>Tratores / Camiões</h3><b id="countTratores">0 registos</b></button><button class="folder" data-category="reboques"><span>🚚</span><h3>Reboques</h3><b id="countReboques">0 registos</b></button><button class="folder" data-category="maquinas"><span>🚜</span><h3>Máquinas</h3><b id="countMaquinas">0 registos</b></button><button class="folder" data-category="pessoal"><span>👷</span><h3>Pessoal</h3><b id="countPessoal">0 registos</b></button></div></section><section id="alertsPanel" class="panel"><h2>Alertas de validades</h2><p>Documentos expirados ou a expirar nos próximos 60 dias.</p><div class="summary"><div class="stat expired"><strong id="expiredCount">0</strong><br>Expirados</div><div class="stat soon"><strong id="soonCount">0</strong><br>A expirar</div><div class="stat total"><strong id="alertCount">0</strong><br>Total</div></div><div id="alertList" class="alerts"></div></section><section id="category" class="hidden"><section class="panel"><h2 id="formTitle">Novo registo</h2><form id="recordForm"><div id="fields" class="form-grid"></div><div class="form-actions"><button class="green">Guardar</button><button id="cancelBtn" type="button" class="gray hidden">Cancelar edição</button></div></form></section><section class="panel"><div class="toolbar"><h2 id="listTitle">Registos</h2><input id="search" type="search" placeholder="Pesquisar..."></div><div class="table-wrap"><table><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div><p id="empty">Não existem registos.</p></section></section></main></section><script>const USERS=[['jaime','jaime','Jaime'],['admin','admin','Administrador'],['alicia','alicia','Alicia']];const configs={tratores:{name:'Tratores / Camiões',fields:[['matricula','Matrícula','text'],['marca','Marca','text'],['modelo','Modelo','text'],['ano','Ano','number'],['quilometragem','Quilometragem','number'],['validadeTacografo','Validade do tacógrafo','date'],['validadeInspecao','Validade da inspeção','date'],['validadeSeguro','Validade do seguro','date'],['dataRevisao','Data da revisão','date'],['condutor','Condutor','text'],['estado','Estado','select',['Disponível','Em serviço','Em manutenção']]]},reboques:{name:'Reboques',fields:[['matricula','Matrícula','text'],['marca','Marca','text'],['tipo','Tipo','text'],['ano','Ano','number'],['carga','Carga máxima','text'],['estado','Estado','select',['Disponível','Em serviço','Em manutenção']]]},maquinas:{name:'Máquinas',fields:[['codigo','Código','text'],['designacao','Designação','text'],['marca','Marca','text'],['modelo','Modelo','text'],['horas','Horas da máquina','number'],['localizacao','Localização','text'],['estado','Estado','select',['Disponível','Em utilização','Em manutenção']]]},pessoal:{name:'Pessoal',fields:[['numero','Número','text'],['nome','Nome','text'],['funcao','Função','text'],['telefone','Telefone','tel'],['email','Email','email'],['numeroCAM','Número do CAM','text'],['validadeCAM','Validade do CAM','date'],['numeroCarta','Carta de condução','text'],['validadeCarta','Validade da carta','date'],['numeroSeguro','Número do seguro','text'],['validadeSeguro','Validade do seguro','date'],['numeroCC','Cartão de Cidadão','text'],['validadeCC','Validade do CC','date'],['estado','Estado','select',['Ativo','De férias','Ausente','Inativo']]]}};const $=id=>document.getElementById(id);let data=JSON.parse(localStorage.getItem('sistemaGestaoDados')||'null')||{tratores:[],reboques:[],maquinas:[],pessoal:[]},current='',editing=null,installPrompt=null;function save(){localStorage.setItem('sistemaGestaoDados',JSON.stringify(data));counts();alerts()}$('loginForm').onsubmit=e=>{e.preventDefault();const u=$('username').value.trim().toLowerCase(),p=$('password').value,found=USERS.find(x=>x[0]===u&&x[1]===p);if(!found){$('loginError').textContent='Utilizador ou palavra-passe incorretos.';return}sessionStorage.setItem('login','true');sessionStorage.setItem('name',found[2]);openApp()};function openApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('loggedUser').textContent=sessionStorage.getItem('name')||'Utilizador';openMenu()}$('logoutBtn').onclick=()=>{sessionStorage.clear();$('app').classList.add('hidden');$('login').classList.remove('hidden')};document.querySelectorAll('.folder').forEach(b=>b.onclick=()=>openCategory(b.dataset.category));$('backBtn').onclick=openMenu;function openMenu(){current='';$('menu').classList.remove('hidden');$('alertsPanel').classList.remove('hidden');$('category').classList.add('hidden');$('backBtn').classList.add('hidden');$('pageName').textContent='Menu principal';counts();alerts()}function openCategory(c){current=c;editing=null;$('menu').classList.add('hidden');$('alertsPanel').classList.add('hidden');$('category').classList.remove('hidden');$('backBtn').classList.remove('hidden');$('pageName').textContent=configs[c].name;$('formTitle').textContent='Novo registo - '+configs[c].name;$('listTitle').textContent='Registos de '+configs[c].name;buildForm();render()}function buildForm(){$('fields').innerHTML='';$('tableHead').innerHTML='';configs[current].fields.forEach(f=>{const d=document.createElement('div');d.className='field';const l=document.createElement('label');l.textContent=f[1];let i;if(f[2]==='select'){i=document.createElement('select');i.innerHTML='<option value="">Selecione</option>'+f[3].map(x=>'<option>'+x+'</option>').join('')}else{i=document.createElement('input');i.type=f[2]}i.id=f[0];i.required=true;d.append(l,i);$('fields').append(d);const th=document.createElement('th');th.textContent=f[1];$('tableHead').append(th)});const th=document.createElement('th');th.textContent='Ações';$('tableHead').append(th)}$('recordForm').onsubmit=e=>{e.preventDefault();const r={};configs[current].fields.forEach(f=>r[f[0]]=$(f[0]).value.trim());if(editing===null)data[current].push(r);else data[current][editing]=r;save();clearForm();render()};function render(){const q=$('search').value.toLowerCase();$('tableBody').innerHTML='';const rows=data[current].map((r,i)=>({r,i})).filter(x=>Object.values(x.r).some(v=>String(v).toLowerCase().includes(q)));$('empty').classList.toggle('hidden',rows.length>0);rows.forEach(x=>{const tr=document.createElement('tr');configs[current].fields.forEach(f=>{const td=document.createElement('td'),v=x.r[f[0]]||'';td.textContent=f[2]==='date'?formatDate(v):v;if(f[2]==='date'&&v){const n=days(v);if(n<0)td.className='date-expired';else if(n<=60)td.className='date-soon'}tr.append(td)});const td=document.createElement('td'),edit=document.createElement('button'),del=document.createElement('button');edit.textContent='Editar';edit.className='orange';del.textContent='Eliminar';del.className='red';edit.onclick=()=>editRecord(x.i);del.onclick=()=>{if(confirm('Eliminar este registo?')){data[current].splice(x.i,1);save();render()}};td.append(edit,document.createTextNode(' '),del);tr.append(td);$('tableBody').append(tr)})}$('search').oninput=render;function editRecord(i){editing=i;configs[current].fields.forEach(f=>$(f[0]).value=data[current][i][f[0]]||'');$('formTitle').textContent='Editar registo';$('cancelBtn').classList.remove('hidden');scrollTo(0,0)}function clearForm(){$('recordForm').reset();editing=null;$('formTitle').textContent='Novo registo - '+configs[current].name;$('cancelBtn').classList.add('hidden')}$('cancelBtn').onclick=clearForm;function counts(){[['countTratores','tratores'],['countReboques','reboques'],['countMaquinas','maquinas'],['countPessoal','pessoal']].forEach(x=>$(x[0]).textContent=data[x[1]].length+' registos')}function formatDate(v){if(!v)return'';const p=v.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v}function days(v){const p=v.split('-').map(Number),d=Date.UTC(p[0],p[1]-1,p[2]),n=new Date(),t=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((d-t)/86400000)}function alerts(){const a=[],sets=[['tratores','Camião',r=>r.matricula,[['validadeTacografo','Tacógrafo'],['validadeInspecao','Inspeção'],['validadeSeguro','Seguro'],['dataRevisao','Revisão']]],['pessoal','Trabalhador',r=>r.nome||r.numero,[['validadeCAM','CAM'],['validadeCarta','Carta de condução'],['validadeSeguro','Seguro'],['validadeCC','Cartão de Cidadão']]]];sets.forEach(s=>data[s[0]].forEach(r=>s[3].forEach(doc=>{if(r[doc[0]]){const n=days(r[doc[0]]);if(n<=60)a.push({who:s[1]+' '+(s[2](r)||'sem identificação'),doc:doc[1],date:r[doc[0]],n})}})));a.sort((x,y)=>x.n-y.n);$('expiredCount').textContent=a.filter(x=>x.n<0).length;$('soonCount').textContent=a.filter(x=>x.n>=0).length;$('alertCount').textContent=a.length;$('alertList').innerHTML=a.length?'':'<p>Não existem alertas.</p>';a.forEach(x=>{const d=document.createElement('div');d.className='alert '+(x.n<0?'expired':'soon');d.innerHTML='<div><b>'+x.who+' - '+x.doc+'</b><br>Validade: '+formatDate(x.date)+'</div><b>'+(x.n<0?'Expirado há '+Math.abs(x.n)+' dias':x.n===0?'Expira hoje':'Faltam '+x.n+' dias')+'</b>';$('alertList').append(d)})}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installBtn').classList.remove('hidden')});$('installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installBtn').classList.add('hidden')}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));if(sessionStorage.getItem('login')==='true')openApp();</script></body></html>
